AWSTemplateFormatVersion: '2010-09-09'
Description: Private MicroCD Labs website statistics with invite-only Cognito sign-in and aggregate CloudWatch metrics.
Metadata:
  com.aws.cloudformation.Context:
    arch: Amplify serves the dashboard shell. API Gateway authorizes access before Lambda queries metrics.
    must:
      - Publish aggregate counts only.
      - Keep self-registration disabled and require MFA.
Parameters:
  AmplifyAppId:
    Type: String
    AllowedPattern: '[a-z0-9]+'
  ConsultationTrackingStart:
    Type: String
    Description: UTC time the consultation funnel went live.
    AllowedPattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z'
  TrafficCoverageStart:
    Type: String
    Description: UTC date when the Amplify app was created.
  LoginDomainPrefix:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9-]{1,61}[a-z0-9]'
  EnquiryTrackingStart:
    Type: String
    Description: UTC time when accepted enquiry tracking was enabled.
  SiteOrigin:
    Type: String
    Default: https://www.microcdlabs.com
    AllowedValues: [https://www.microcdlabs.com]
Resources:
  AdminUsers:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Isolates website administrators from customer-facing identities.
        must: Only provision accounts for designated administrators.
    Properties:
      UserPoolName: !Ref AWS::StackName
      UserPoolTier: ESSENTIALS
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
  AdminClient:
    Type: AWS::Cognito::UserPoolClient
    Metadata:
      com.aws.cloudformation.Context:
        why: Keeps sign-in and MFA on the hosted login; the website uses code exchange with PKCE.
        must: Keep public client without a secret and use exact redirect allowlists.
    Properties:
      UserPoolId: !Ref AdminUsers
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub '${SiteOrigin}/admin.html']
      LogoutURLs: [!Sub '${SiteOrigin}/admin.html']
      AccessTokenValidity: 15
      TokenValidityUnits:
        AccessToken: minutes
  LoginDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref AdminUsers
      Domain: !Ref LoginDomainPrefix
      ManagedLoginVersion: 2
  LoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref AdminUsers
      ClientId: !Ref AdminClient
      UseCognitoProvidedValues: true
  AdminApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Ref AWS::StackName
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref SiteOrigin, 'https://microcdlabs.com']
        AllowMethods: [GET, POST]
        AllowHeaders: [Authorization, Content-Type]
  AdminAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref AdminApi
      Name: AdminCognito
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref AdminClient]
        Issuer: !GetAtt AdminUsers.ProviderURL
  StatsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: ReadCloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudwatch:GetMetricData
                Resource: '*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${PageReportBucket.Arn}/page-traffic.json'
  StatsFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Keeps metric access behind the authenticated route and returns daily aggregates.
        must: Read fixed site metrics and avoid collecting submission contents.
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt StatsRole.Arn
      Timeout: 8
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          AMPLIFY_APP_ID: !Ref AmplifyAppId
          ENQUIRY_TRACKING_START: !Ref EnquiryTrackingStart
          CONSULTATION_TRACKING_START: !Ref ConsultationTrackingStart
          TRAFFIC_COVERAGE_START: !Ref TrafficCoverageStart
          REPORT_BUCKET: !Ref PageReportBucket
      Code:
        ZipFile: |
          const { CloudWatchClient, GetMetricDataCommand } = require('@aws-sdk/client-cloudwatch');

          const { S3Client, GetObjectCommand } = require('@aws-sdk/client-s3');
          const cloudwatch = new CloudWatchClient({});
          const s3 = new S3Client({});
          const day = 86400000;
          const sources = ['home', 'services', 'components', 'clair', 'tools', 'labops', 'other', 'direct', 'external'];
          const funnelMetrics = {
            starts: 'ConsultationStarts', attempts: 'ConsultationAttempts', accepted: 'ConsultationAccepted'
          };

          function metric(id, namespace, name, dimensions = []) {
            return {
              Id: id,
              MetricStat: {
                Metric: { Namespace: namespace, MetricName: name, Dimensions: dimensions },
                Period: 86400,
                Stat: 'Sum'
              }
            };
          }

          async function readPageTraffic() {
            try {
              const { Body } = await s3.send(new GetObjectCommand({
                Bucket: process.env.REPORT_BUCKET,
                Key: 'page-traffic.json'
              }));
              return JSON.parse(await Body.transformToString());
            } catch (error) {
              if (error.name !== 'NoSuchKey' && error.name !== 'AccessDenied') {
                console.error('Unable to read page traffic report', error.name);
              }
              return null;
            }
          }

          exports.handler = async (event) => {
            const headers = { 'content-type': 'application/json', 'cache-control': 'no-store' };
            const claims = event.requestContext?.authorizer?.jwt?.claims;
            if (claims?.token_use !== 'access') {
              return { statusCode: 403, headers, body: JSON.stringify({ error: 'Access denied' }) };
            }

            const end = Date.now();
            const start = Math.floor(end / day) * day - 29 * day;
            const startTracking = new Date(process.env.ENQUIRY_TRACKING_START);
            const consultationStart = new Date(process.env.CONSULTATION_TRACKING_START);
            const launch = new Date(process.env.TRAFFIC_COVERAGE_START);
            const queries = [
              metric('requests', 'AWS/AmplifyHosting', 'Requests', [{ Name: 'App', Value: process.env.AMPLIFY_APP_ID }]),
              metric('enquiries', 'MicroCDLabs/Website', 'AcceptedEnquiries'),
              ...sources.flatMap(source => Object.entries(funnelMetrics).map(([step, name]) =>
                metric(step + '_' + source, 'MicroCDLabs/Website', name, [{Name: 'Source', Value: source}])
              ))
            ];

            try {
              const [response, pageTraffic] = await Promise.all([cloudwatch.send(new GetMetricDataCommand({
                StartTime: launch,
                EndTime: new Date(end),
                MetricDataQueries: queries
              })), readPageTraffic()]);
              const series = new Map(response.MetricDataResults.map((result) => [
                result.Id,
                { complete: result.StatusCode === 'Complete', values: new Map(
                  result.Timestamps.map((timestamp, index) => [timestamp.toISOString().slice(0, 10), result.Values[index]])
                ) }
              ]));
              const days = Array.from({ length: 30 }, (_, index) => {
                const date = new Date(start + index * day).toISOString().slice(0, 10);
                const requests = series.get('requests');
                const enquiries = series.get('enquiries');
                return {
                  date,
                  requests: requests?.complete ? (requests.values.get(date) ?? 0) : null,
                  enquiries: enquiries?.complete && date >= startTracking.toISOString().slice(0, 10)
                    ? (enquiries.values.get(date) ?? 0) : null
                };
              });
              const requests = series.get('requests');
              const allTimeRequests = requests?.complete
                ? [...requests.values.values()].reduce((sum, count) => sum + count, 0) : null;
              const funnelStartDate = new Date(Math.max(start, consultationStart.getTime())).toISOString().slice(0, 10);
              const funnel = sources.map(source => ({
                source,
                ...Object.fromEntries(Object.keys(funnelMetrics).map(step => {
                  const metric = series.get(step + '_' + source);
                  const total = metric?.complete
                    ? [...metric.values].reduce((sum, [date, count]) => date >= funnelStartDate ? sum + count : sum, 0) : null;
                  return [step, total];
                }))
              }));
              const allTimeStart = requests?.values.size
                ? [...requests.values.keys()].sort()[0] : null;
              return { statusCode: 200, headers, body: JSON.stringify({
                days, enquiryTrackingStart: startTracking.toISOString(),
                allTimeRequests, allTimeStart, pageTraffic,
                consultationTrackingStart: consultationStart.toISOString(), funnel
              }) };
            } catch (error) {
              console.error('Unable to read website metrics', error.name);
              return { statusCode: 503, headers, body: JSON.stringify({ error: 'Stats temporarily unavailable' }) };
            }
          };
  StatsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AdminApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StatsFunction.Arn
      PayloadFormatVersion: '2.0'
  StatsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: GET /stats
      AuthorizationType: JWT
      AuthorizationScopes: [openid]
      AuthorizerId: !Ref AdminAuthorizer
      Target: !Sub 'integrations/${StatsIntegration}'
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref AdminApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 4
        ThrottlingRateLimit: 2
  InvocationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StatsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApi}/$default/GET/stats'
  EnquiryEventRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
  EnquiryEventFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Count browser interactions without touching the email delivery function.
        must: Accept only the defined event and source labels. Never log request data.
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt EnquiryEventRole.Arn
      Timeout: 5
      MemorySize: 128
      ReservedConcurrentExecutions: 2
      Code:
        ZipFile: |
          const sources = new Set(['home', 'services', 'components', 'clair', 'tools', 'labops', 'other', 'direct', 'external']);
          const metrics = new Map([['start', 'ConsultationStarts'], ['submit', 'ConsultationAttempts']]);
          const origins = new Set(['https://www.microcdlabs.com', 'https://microcdlabs.com']);

          exports.handler = async (request) => {
            const headers = {'cache-control': 'no-store'};
            if (!origins.has(request.headers?.origin)) return {statusCode: 403, headers};
            if (request.requestContext?.http?.method !== 'POST') return {statusCode: 405, headers};
            if (!request.body || request.body.length > 160 || request.isBase64Encoded) return {statusCode: 400, headers};

            let payload;
            try { payload = JSON.parse(request.body); } catch { return {statusCode: 400, headers}; }
            const metric = metrics.get(payload?.event);
            if (!metric || !sources.has(payload?.source) || Object.keys(payload).length !== 2) return {statusCode: 400, headers};

            // Each log record contains only a fixed metric name and a bounded source label.
            process.stdout.write(JSON.stringify({
              _aws: {
                Timestamp: Date.now(),
                CloudWatchMetrics: [{
                  Namespace: 'MicroCDLabs/Website',
                  Dimensions: [['Source']],
                  Metrics: [{Name: metric, Unit: 'Count'}]
                }]
              },
              Source: payload.source,
              [metric]: 1
            }) + '\n');
            return {statusCode: 204, headers};
          };
  EnquiryEventIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AdminApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt EnquiryEventFunction.Arn
      PayloadFormatVersion: '2.0'
  EnquiryEventRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: POST /enquiry-events
      AuthorizationType: NONE
      Target: !Sub 'integrations/${EnquiryEventIntegration}'
  EnquiryEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EnquiryEventFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApi}/$default/POST/enquiry-events'
  PageReportBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOlderSnapshots
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  PageReportBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PageReportBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt PageReportBucket.Arn
              - !Sub '${PageReportBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
  PageTrafficRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: GeneratePageTrafficReport
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: amplify:GenerateAccessLogs
                Resource: !Sub 'arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${PageReportBucket.Arn}/page-traffic.json'
  PageTrafficFunction:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Produces recent per-page traffic from the hosting access logs before admins open the dashboard.
        must: Save only aggregate counts and public paths. Discard raw log records.
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt PageTrafficRole.Arn
      Timeout: 600
      MemorySize: 384
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          AMPLIFY_APP_ID: !Ref AmplifyAppId
          DOMAIN: microcdlabs.com
          REPORT_BUCKET: !Ref PageReportBucket
      Code:
        ZipFile: |
          const { AmplifyClient, GenerateAccessLogsCommand } = require('@aws-sdk/client-amplify');
          const { S3Client, PutObjectCommand } = require('@aws-sdk/client-s3');
          const { Readable } = require('node:stream');
          const { createInterface } = require('node:readline');

          const amplify = new AmplifyClient({});
          const s3 = new S3Client({});
          const day = 86400000;
          const needed = ['cs-method', 'cs-uri-stem', 'sc-status', 'sc-content-type', 'x-host-header'];

          function csvFields(line) {
            const fields = [];
            const pattern = /(?:^|,)(?:"((?:[^"]|"")*)"|([^,]*))/g;
            for (const entry of line.matchAll(pattern)) {
              fields.push(entry[1] === undefined ? entry[2] : entry[1].replaceAll('""', '"'));
            }
            return fields;
          }

          function normalizePage(path) {
            if (!/^\/[A-Za-z0-9_./-]*$/.test(path)) return null;
            const clean = path.replace(/\/index\.html$/i, '/').replace(/\.html$/i, '').replace(/\/+$/, '') || '/';
            return /(?:^|\/)admin(?:\/|$)/i.test(clean) ? null : clean;
          }

          async function tallyWindow(start, end, counts) {
            const { logUrl } = await amplify.send(new GenerateAccessLogsCommand({
              appId: process.env.AMPLIFY_APP_ID,
              domainName: process.env.DOMAIN,
              startTime: new Date(start),
              endTime: new Date(end - 1)
            }));
            if (!logUrl || new URL(logUrl).protocol !== 'https:') throw new Error('Missing HTTPS log export');
            const response = await fetch(logUrl, { signal: AbortSignal.timeout(55000) });
            if (!response.ok || !response.body) throw new Error('Log export HTTP ' + response.status);
            const lines = createInterface({ input: Readable.fromWeb(response.body), crlfDelay: Infinity });
            let indices;
            for await (const line of lines) {
              if (!line.trim()) continue;
              const fields = csvFields(line);
              if (!indices) {
                indices = needed.map((name) => fields.indexOf(name));
                if (indices.some((index) => index < 0)) throw new Error('Unexpected access log columns');
                continue;
              }
              const [method, path, status, contentType, host] = indices.map((index) => fields[index]);
              if (host !== 'www.' + process.env.DOMAIN || method !== 'GET') continue;
              const html = /^text\/html(?:;|$)/i.test(contentType ?? '');
              const cachedHtml = status === '304' && (path?.endsWith('/') || /\.html$/i.test(path ?? '') || !/\.[^/]+$/.test(path ?? ''));
              if (!(status === '200' && html) && !cachedHtml) continue;
              const page = normalizePage(path ?? '');
              if (page) counts.set(page, (counts.get(page) ?? 0) + 1);
            }
            if (!indices) throw new Error('Missing access log header');
          }

          exports.handler = async () => {
            const end = Math.floor(Date.now() / day) * day;
            const start = end - 30 * day;
            const counts = new Map();
            const windowSize = 2 * day;
            const windows = Array.from({ length: 15 }, (_, index) => start + index * windowSize);
            for (let index = 0; index < windows.length; index += 4) {
              await Promise.all(windows.slice(index, index + 4).map((from) =>
                tallyWindow(from, from + windowSize, counts)
              ));
            }
            const report = {
              start: new Date(start).toISOString(),
              end: new Date(end).toISOString(),
              pages: [...counts].sort(([pathA, a], [pathB, b]) => b - a || pathA.localeCompare(pathB))
                .map(([path, requests]) => ({ path, requests }))
            };
            await s3.send(new PutObjectCommand({
              Bucket: process.env.REPORT_BUCKET,
              Key: 'page-traffic.json',
              ContentType: 'application/json',
              Body: JSON.stringify(report)
            }));
            return { pages: report.pages.length };
          };
  PageTrafficSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: 'cron(0 12 * * ? *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt PageTrafficFunction.Arn
          Id: DailyPageTraffic
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 3600
  PageTrafficInvocation:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PageTrafficFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PageTrafficSchedule.Arn
Outputs:
  UserPoolId:
    Value: !Ref AdminUsers
  ClientId:
    Value: !Ref AdminClient
  LoginOrigin:
    Value: !Sub 'https://${LoginDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  StatsEndpoint:
    Value: !Sub '${AdminApi.ApiEndpoint}/stats'
