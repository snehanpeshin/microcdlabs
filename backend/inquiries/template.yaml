AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MicroCD Labs inquiry email endpoint (deploy separately from static Amplify hosting)
Parameters:
  SenderEmail:
    Type: String
    Description: SES-verified sending email address in this AWS region
  RecipientEmail:
    Type: String
    Default: info@microcdlabs.com
  QuoteSandboxTableName:
    Type: String
    Default: ''
  QuoteSandboxTableArn:
    Type: String
    Default: ''
  QuoteSandboxRecipient:
    Type: String
    Default: ''
Conditions:
  SandboxQueueConfigured: !And
    - !Not [!Equals [!Ref QuoteSandboxTableName, '']]
    - !Not [!Equals [!Ref QuoteSandboxTableArn, '']]
    - !Not [!Equals [!Ref QuoteSandboxRecipient, '']]
Resources:
  InquiryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins: ['https://www.microcdlabs.com', 'https://microcdlabs.com']
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [Content-Type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2
        ThrottlingRateLimit: 0.1
  InquiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.handler
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 128
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          RECIPIENT_EMAIL: !Ref RecipientEmail
          QUOTE_TABLE: !If [SandboxQueueConfigured, !Ref QuoteSandboxTableName, '']
          QUOTE_SANDBOX_RECIPIENT: !If [SandboxQueueConfigured, !Ref QuoteSandboxRecipient, '']
          ALLOWED_ORIGINS: 'https://www.microcdlabs.com,https://microcdlabs.com'
      Policies:
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderEmail}'
              Condition:
                StringEquals:
                  ses:FromAddress: !Ref SenderEmail
                ForAllValues:StringEquals:
                  ses:Recipients: [!Ref RecipientEmail]
        - !If
          - SandboxQueueConfigured
          - Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !Ref QuoteSandboxTableArn
          - !Ref AWS::NoValue
      Events:
        Submit:
          Type: HttpApi
          Properties:
            ApiId: !Ref InquiryApi
            Path: /inquiries
            Method: POST
Outputs:
  Endpoint:
    Value: !Sub 'https://${InquiryApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/inquiries'
