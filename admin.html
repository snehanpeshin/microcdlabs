<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://microcdlabs-website-admin-924225826927.auth.us-east-1.amazoncognito.com https://v4jt5tbwwh.execute-api.us-east-1.amazonaws.com; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="MicroCD Labs website traffic and enquiry totals for invited administrators.">
  <link rel="canonical" href="https://www.microcdlabs.com/admin.html">
  <link rel="icon" href="assets/microcd-tab-icon.svg" type="image/svg+xml">
  <meta name="referrer" content="no-referrer">
  <title>Website stats | MicroCD Labs</title>
  <link rel="stylesheet" href="assets/website-admin.css">
  <script type="module" src="assets/website-admin.js"></script>
</head>
<body>
  <header><a href="/" aria-label="MicroCD Labs home"><img src="assets/microcd-labs-wordmark.svg" alt="MicroCD Labs" width="154" height="34"></a></header>
  <main>
    <h1>Website stats</h1>
    <p id="status" role="status">Loading sign-in…</p>
    <button id="sign-in" type="button" hidden>Admin sign-in</button>
    <button id="sign-out" type="button" hidden>Sign out</button>
    <section id="dashboard" aria-labelledby="stats-heading" hidden>
      <h2 id="stats-heading">Last 30 days <small>UTC, including today</small></h2>
      <dl>
        <div><dt>Website requests</dt><dd id="requests">—</dd><dd class="stat-note">Includes asset requests and bots.</dd></div>
        <div><dt>Accepted enquiries</dt><dd id="enquiries">—</dd><dd class="stat-note" id="coverage"></dd></div>
      </dl>
      <table>
        <caption>Daily totals</caption>
        <thead><tr><th scope="col">Date (UTC)</th><th scope="col">Website requests</th><th scope="col">Accepted enquiries</th></tr></thead>
        <tbody id="days"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
